[package]
name = "rust"
version = "0.1.0"
edition = "2024"

[lib]
path = "src/wasm-rust.rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
js-sys = "0.3.78"
wasm-bindgen = "0.2"
serde-wasm-bindgen = "0.6.5"
priority-queue = "2.5.0"
hash_cons = "0.2.0"
sha2 = "0.10.9"
console_error_panic_hook = "0.1.7"
order-maintenance = "0.1.1"

[dependencies.web-sys]
version = "0.3"
features = [ "console" ]

[dependencies.serde]
version = "1.0.219"
features = ["derive"]

[dependencies.uuid]
version = "1.10.1"
features = [
    "serde", "v4", "js"
]
